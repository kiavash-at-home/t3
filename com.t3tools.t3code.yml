app-id: com.t3tools.t3code

runtime: org.freedesktop.Platform
runtime-version: &runtime-version '26.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: startt3code
branch: master
separate-locales: false

add-extensions:
  com.t3tools.t3code.Tools:
    directory: tools
    version: *runtime-version
    subdirectories: true
    no-autodownload: true
    autodelete: true
    add-ld-path: lib

finish-args:
  # Electron needs the render device for accelerated compositing and animations.
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --env=GTK_USE_PORTAL=1
  - --env=T3CODE_SERVER_BROWSER_SANDBOX=0
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons # This is used to show the correct cursor on Wayland
  - --env=AGY_CLI_DISABLE_AUTO_UPDATE=true
  - --filesystem=home/.t3:create # T3 Code settings, state DB, auth tokens, secrets, worktrees
  - --persist=.grok # Grok Build settings, authentication, sessions
  - --persist=.gemini # Antigravity CLI configuration and sessions

modules:
  - name: git
    buildsystem: simple
    build-commands:
      - make prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease NO_RUST=YesPlease all
      - make prefix=/app NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease NO_RUST=YesPlease install
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3

  - name: grok-build
    buildsystem: simple
    build-commands:
      - install -Dm755 grok /app/bin/grok
      - /app/bin/grok --version
    sources:
      - type: file
        url: https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-1.0.70-linux-x86_64
        dest-filename: grok
        sha256: 22d281c5964c5444147328096ba2a221f3f0874c6858e27c825656a80f6e58e9
        only-arches: [x86_64]

  - name: antigravity-acp
    buildsystem: simple
    build-commands:
      - install -d agy-acp-extract /app/bin
      - unzip agy-acp-server-linux-x86_64.zip -d agy-acp-extract
      - install -Dm755 agy-acp-extract/agy_acp_server.par /app/bin/agy_acp_server.par
      - install -Dm755 agy-acp-extract/localharness_external /app/bin/localharness_external
    sources:
      - type: file
        url: https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-1.4.5-linux-x86_64.zip
        dest-filename: agy-acp-server-linux-x86_64.zip
        sha256: 923923a0d7dc8073f66cc6f78647a3107e3a7ee2b7e1a24df8b3927b5188013b
        only-arches: [x86_64]

  - name: t3code
    buildsystem: simple
    build-commands:
      # Extract the Debian package.
      - install -d deb-root
      - ar x T3-Code.deb
      - tar -xf data.tar.* -C deb-root

      # Patch Electron metadata and desktop identity.
      # Keep all related commands in one shell block because appdir
      # must remain available throughout the operations.
      - |
        set -eu

        appdir="deb-root/opt/T3 Code (Beta)"

        test -d "$appdir"
        test -x "$appdir/t3code"
        test -f "$appdir/resources/app.asar"

        rm -f "$appdir/resources/app-update.yml"
        rm -f "$appdir/resources/dev-app-update.yml"

        if find "$appdir" -type f \( \
          -name app-update.yml -o \
          -name dev-app-update.yml \
        \) -print -quit | grep -q .; then
          echo "Unexpected Electron updater metadata remains." >&2
          exit 1
        fi

        asar="$appdir/resources/app.asar"
        old='com.t3tools.T3Code.desktop'
        new='com.t3tools.t3code.desktop'
        sentinel='dL7pKGdnNz796PbbjQWNKmHXBZaB9tsX'

        fuse_offset=$(grep -aobF "$sentinel" "$appdir/t3code" | head -n 1 | cut -d: -f1)

        if [ -z "$fuse_offset" ]; then
          echo "Electron fuse sentinel not found." >&2
          exit 1
        fi

        integrity_fuse=$(dd if="$appdir/t3code" bs=1 \
          skip=$((fuse_offset + ${#sentinel} + 2 + 4)) \
          count=1 status=none)

        if [ "$integrity_fuse" = 1 ]; then
          echo "Embedded ASAR integrity validation is enabled." >&2
          exit 1
        fi

        if [ "$(grep -aoF "$old" "$asar" | wc -l)" -ne 1 ]; then
          echo "Expected exactly one '$old' in app.asar." >&2
          exit 1
        fi

        sed -i "s/com\.t3tools\.T3Code\.desktop/$new/g" "$asar"

        test "$(grep -aoF "$old" "$asar" | wc -l)" -eq 0
        test "$(grep -aoF "$new" "$asar" | wc -l)" -eq 1

      # Install desktop entry with Flatpak executable and MIME handler.
      - |
        desktop-file-edit \
          --set-key="Exec" \
          --set-value="startt3code %U" \
          --set-icon="$FLATPAK_ID" \
          --add-mime-type=x-scheme-handler/t3code \
          --remove-mime-type=x-scheme-handler/t3code-dev \
          "deb-root/usr/share/applications/t3code.desktop"

      # Install application icons.
      - |
        for icon in 16 22 24 32 48 64 128 256 512; do
          install -D \
            "deb-root/usr/share/icons/hicolor/${icon}x${icon}/apps/t3code.png" \
            "/app/share/icons/hicolor/${icon}x${icon}/apps/com.t3tools.t3code.png"
        done

      # Install desktop entry and launcher.
      - install -D deb-root/usr/share/applications/t3code.desktop /app/share/applications/com.t3tools.t3code.desktop
      - install -Dm755 startt3code /app/bin/startt3code

      # Prepare tool extension directory.
      - install -d /app/tools

      # Install provider installer and AppStream metadata.
      - install -D com.t3tools.t3code.metainfo.xml -t /app/share/metainfo/

      # Install application.
      - mv "deb-root/opt/T3 Code (Beta)" /app/bin/t3code
    sources:
      - type: file
        path: startt3code

      - type: file
        path: com.t3tools.t3code.metainfo.xml

      - type: file
        url: https://github.com/pingdotgg/t3code/releases/download/v0.1.9/T3-Code-0.1.9-amd64.deb
        dest-filename: T3-Code.deb
        sha256: 418c7825f73107b7b5ba3babae5e3b485801dc22d9dc0d518af632f7906cbdd1
        only-arches: [x86_64]

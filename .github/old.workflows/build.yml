
name: CI Build Flatpak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-${{ vars.FREEDESKTOP_VERSION }}
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: t3code.flatpak
          upload-artifact: false
          manifest-path: com.t3tools.t3code.yml
          arch: x86_64
          verbose: true
          cache: true
          cache-key: flatpak-builder-${{ vars.FREEDESKTOP_VERSION }}-${{ hashFiles('com.t3tools.t3code.yml') }}

      - name: Generate checksum
        shell: bash
        run: sha256sum t3code.flatpak > t3code.flatpak.sha256

      - name: Upload Flatpak and checksum
        uses: actions/upload-artifact@v7
        with:
          name: t3code-flatpak
          path: |
            t3code.flatpak
            t3code.flatpak.sha256
          if-no-files-found: error
          compression-level: 0
